<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>
        table, td, th {
            border: 2px solid blue;
            border-collapse: collapse;
        }
        table { width: 40%; margin: auto;}
        tr {height: 80px;}
        td {vertical-align: center;
        text-align: center;}
        tr:hover {background-color: darkorchid;}
        tr:nth-child(even){background-color: aqua;}
    </style>
</head>
<body>
    <a href="margenes.html">Ver márgenes y páginas</a>
    <h1>Css en tablas</h1>
    <table>
        <tr>
            <th>
                Articulo
            </th>
            <th>
                Precio
            </th>
        </tr>
        <tr>
            <td>Aceite de Oliva</td>
            <td>10.00€</td>
        </tr>
        <tr>
            <td>Tortas de Alcázar</td>
            <td>6.5€</td>
        </tr>
        <tr>
            <td>Miguelitos de La Roda</td>
            <td>12.00€</td>
        </tr>

    </table>
</body>
</html>
